name: Update NBA stats
on:
  schedule:
    - cron: "0 10 * * *"   # daily, 10:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api
      - run: python scripts/update_stats.py
        env:
          NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
      - name: Commit changes
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/players.json
          git diff --staged --quiet || (git commit -m "Update player stats" && git push)
